<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form>
        <label for="nome-completo">Nome Completo:</label><br>
        <input type="text" name="nome-completo" size="30" placeholder="Insira seu nome aqui" required><br>

        <br>

        <label for="nacao">Nacionalidade:</label><br>
        <select id="nacao" name="nacao" required>
            <option value="" selected>Selecione...</option>
            <option value="brasil">Brasil</option>
            <option value="argentina">Argentina</option>
        </select>

        <br> <br>

        <label for="faixa-etaria" >Faixa Etária:</label> <br>
        <input type="radio" id="menor" name="faixa_etaria" required> <label for="menor"> 0 a 18 anos</label> <br>
        <input type="radio" id="resto" name="faixa_etaria"> <label for="o-resto"> O resto (kkk)</label> <br>

        <br>

        <label for="n-tenho-ideias">Escreva o porquê de você estar aqui:</label><br>
        <textarea name="n-tenho-ideias" row="100" cols="100" placeholder="Insira sua motivação aqui" required></textarea><br>
        
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
